<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>三国杀 · 群雄逐鹿 — 网页版五人军争</title>
    <meta name="description" content="基于 React 构建的网页版《三国杀》五人身份局。内置 AI 对手与战术军师，水墨国风界面，支持 5 人 / 7 人军争模式，无需下载，打开即战。" />
    <meta name="keywords" content="三国杀,网页游戏,卡牌,身份局,军争, sanguosha" />
    <meta name="author" content="chenbenkong" />
    <meta name="theme-color" content="#1a1410" />
    <meta property="og:title" content="三国杀 · 群雄逐鹿" />
    <meta property="og:description" content="网页版《三国杀》五人身份局 — 水墨国风 · AI 军师 · 打开即战" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chenbenkong.github.io/sanguosha/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!-- 字体本地自托管：按项目实际用字子集化（三款 woff2 共约 430KB），预加载首屏最关键的两款 -->
    <link rel="preload" href="./fonts/MaShanZheng-sub.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/NotoSerifSC-400-sub.woff2" as="font" type="font/woff2" crossorigin>

    <!-- 样式（构建期 Tailwind + 主题，替代原 CDN 运行时编译） -->
    <link rel="stylesheet" href="./src/styles/theme.css">

    <style>
      /* 本地字体：Ma Shan Zheng 毛笔标题字 + Noto Serif SC 正文宋 */
      @font-face {
        font-family: 'Ma Shan Zheng';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/MaShanZheng-sub.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Noto Serif SC';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/NotoSerifSC-400-sub.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Noto Serif SC';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./fonts/NotoSerifSC-700-sub.woff2') format('woff2');
      }
      body {
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
        background-color: #1a1512;
        color: #e5e5e5;
        overscroll-behavior: none;
        /* Wood texture background pattern */
        background-image: repeating-linear-gradient(45deg, #1a1512 25%, transparent 25%, transparent 75%, #1a1512 75%, #1a1512), repeating-linear-gradient(45deg, #1a1512 25%, #261f1b 25%, #261f1b 75%, #1a1512 75%, #1a1512);
        background-position: 0 0, 10px 10px;
        background-size: 20px 20px;
      }
      .font-ancient {
        font-family: 'Ma Shan Zheng', 'Kaiti SC', 'STKaiti', 'KaiTi', cursive;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #2d2420;
      }
      ::-webkit-scrollbar-thumb {
        background: #8c6a4a;
        border-radius: 3px;
      }
      .card-shadow {
        box-shadow: 2px 4px 12px rgba(0,0,0,0.7);
      }
      .wood-border {
        border: 2px solid #5d4037;
        box-shadow: inset 0 0 10px #000;
      }
      /* Shimmer Animation */
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .animate-shimmer {
        animation: shimmer 1.5s infinite;
      }

      /* 卡牌飞入动画 - 优化版，使用硬件加速 */
      @keyframes card-fly-in {
        0% {
          transform: translate3d(-100vw, 0, 0) rotate3d(0, 0, 1, -20deg) scale3d(0.6, 0.6, 1);
          opacity: 0;
        }
        60% {
          opacity: 1;
        }
        80% {
          transform: translate3d(10px, 0, 0) rotate3d(0, 0, 1, 3deg) scale3d(1.05, 1.05, 1);
        }
        100% {
          transform: translate3d(0, 0, 0) rotate3d(0, 0, 1, 0deg) scale3d(1, 1, 1);
          opacity: 1;
        }
      }
      .animate-card-fly-in {
        animation: card-fly-in 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        will-change: transform, opacity;
        backface-visibility: hidden;
      }

      /* 卡牌弹跳动画 - 优化版 */
      @keyframes card-bounce {
        0%, 100% { transform: scale3d(1.1, 1.1, 1); }
        50% { transform: scale3d(1.13, 1.13, 1); }
      }
      .animate-card-bounce {
        animation: card-bounce 0.4s ease-in-out 0.5s;
        will-change: transform;
      }

      /* 淡入上移动画 */
      @keyframes fade-in-up {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.4s ease-out 0.8s forwards;
        opacity: 0;
      }

      /* 粒子动画 - 优化版，使用硬件加速 */
      @keyframes particle-1 {
        0% { transform: translate3d(0, 0, 0) scale3d(0, 0, 1); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate3d(-80px, -80px, 0) scale3d(1, 1, 1); opacity: 0; }
      }
      @keyframes particle-2 {
        0% { transform: translate3d(0, 0, 0) scale3d(0, 0, 1); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate3d(80px, -80px, 0) scale3d(1, 1, 1); opacity: 0; }
      }
      @keyframes particle-3 {
        0% { transform: translate3d(0, 0, 0) scale3d(0, 0, 1); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate3d(-80px, 80px, 0) scale3d(1, 1, 1); opacity: 0; }
      }
      @keyframes particle-4 {
        0% { transform: translate3d(0, 0, 0) scale3d(0, 0, 1); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate3d(80px, 80px, 0) scale3d(1, 1, 1); opacity: 0; }
      }
      .animate-particle-1 {
        animation: particle-1 0.8s ease-out 0.4s forwards;
        will-change: transform, opacity;
      }
      .animate-particle-2 {
        animation: particle-2 0.8s ease-out 0.5s forwards;
        will-change: transform, opacity;
      }
      .animate-particle-3 {
        animation: particle-3 0.8s ease-out 0.6s forwards;
        will-change: transform, opacity;
      }
      .animate-particle-4 {
        animation: particle-4 0.8s ease-out 0.7s forwards;
        will-change: transform, opacity;
      }

      /* 背景轮播 - 水墨生成动画 */
      @keyframes inkForm {
        0% {
          opacity: 0;
          clip-path: circle(0% at 30% 30%);
          filter: contrast(1.5) brightness(1.3);
        }
        20% {
          opacity: 0.3;
          clip-path: circle(15% at 30% 30%);
        }
        40% {
          opacity: 0.6;
          clip-path: circle(35% at 35% 40%);
        }
        60% {
          opacity: 0.85;
          clip-path: circle(60% at 45% 50%);
          filter: contrast(1.2) brightness(1.15);
        }
        80% {
          opacity: 0.95;
          clip-path: circle(85% at 50% 55%);
        }
        100% {
          opacity: 1;
          clip-path: circle(150% at 50% 50%);
          filter: contrast(1) brightness(1);
        }
      }
      .animate-ink-form {
        animation: inkForm 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      /* 背景轮播 - 水墨消散动画 */
      @keyframes inkDissolve {
        0% {
          opacity: 1;
          clip-path: circle(150% at 50% 50%);
          filter: contrast(1) brightness(1);
        }
        20% {
          opacity: 0.9;
          clip-path: circle(100% at 55% 45%);
        }
        40% {
          opacity: 0.7;
          clip-path: circle(70% at 60% 40%);
          filter: contrast(1.1) brightness(0.95);
        }
        60% {
          opacity: 0.4;
          clip-path: circle(40% at 65% 35%);
        }
        80% {
          opacity: 0.15;
          clip-path: circle(15% at 70% 30%);
          filter: contrast(1.3) brightness(0.9);
        }
        100% {
          opacity: 0;
          clip-path: circle(0% at 75% 25%);
        }
      }
      .animate-ink-dissolve {
        animation: inkDissolve 3s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
      }

      /* 背景轮播 - 粉尘粒子漂浮动画 */
      @keyframes dustParticle {
        0% {
          opacity: 0;
          transform: scale(0) translate(0, 0);
        }
        20% {
          opacity: 0.6;
          transform: scale(1.5) translate(var(--tx, 10px), var(--ty, -10px));
        }
        60% {
          opacity: 0.3;
          transform: scale(2) translate(var(--tx, 20px), var(--ty, -20px));
        }
        100% {
          opacity: 0;
          transform: scale(0.5) translate(var(--tx, 30px), var(--ty, -30px));
        }
      }
      .animate-dust-particle {
        animation: dustParticle 3s ease-out forwards;
      }

      /* 闪烁光点 */
      @keyframes sparkle {
        0%, 100% {
          opacity: 0;
          transform: scale(0.5);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-sparkle {
        animation: sparkle 2s ease-in-out infinite;
      }

      /* 水波淡入 */
      @keyframes waterFadeIn {
        0% {
          opacity: 0;
          transform: scale(1.03);
          filter: blur(2px);
        }
        50% {
          opacity: 0.7;
          filter: blur(1px);
        }
        100% {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
        }
      }
      .animate-water-fade-in {
        animation: waterFadeIn 3s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      }

      /* 水波淡出 */
      @keyframes waterFadeOut {
        0% {
          opacity: 1;
          filter: blur(0);
        }
        100% {
          opacity: 0;
          filter: blur(1px);
        }
      }
      .animate-water-fade-out {
        animation: waterFadeOut 3s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      }

      /* 水波纹扩散 */
      @keyframes waterRipple {
        0% {
          opacity: 0.3;
          transform: translate(-50%, -50%) scale(0.5);
        }
        50% {
          opacity: 0.15;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(2);
        }
      }
      .animate-water-ripple {
        animation: waterRipple 3s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      }

      /* 背景轮播 - 进度条动画 */
      @keyframes progressBar {
        0% { width: 0%; }
        100% { width: 100%; }
      }

      /* 伤害震动动画 */
      @keyframes damage-shake {
        0%, 100% { transform: translateX(0); }
        10% { transform: translateX(-10px) rotate(-3deg); }
        20% { transform: translateX(10px) rotate(3deg); }
        30% { transform: translateX(-10px) rotate(-3deg); }
        40% { transform: translateX(10px) rotate(3deg); }
        50% { transform: translateX(-5px) rotate(-2deg); }
        60% { transform: translateX(5px) rotate(2deg); }
        70% { transform: translateX(-3px) rotate(-1deg); }
        80% { transform: translateX(3px) rotate(1deg); }
        90% { transform: translateX(0) rotate(0); }
      }
      .animate-damage-shake {
        animation: damage-shake 0.6s ease-in-out;
      }

      /* 伤害数字飘字动画 */
      @keyframes damage-float {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-30px) scale(1.2);
        }
        100% {
          opacity: 0;
          transform: translateY(-60px) scale(0.8);
        }
      }
      .animate-damage-float {
        animation: damage-float 1s ease-out forwards;
      }

      /* 治疗绿色光晕动画 */
      @keyframes heal-glow {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
        }
        25% {
          box-shadow: 0 0 20px 10px rgba(34, 197, 94, 0.6);
        }
        50% {
          box-shadow: 0 0 40px 20px rgba(34, 197, 94, 0.8);
        }
        75% {
          box-shadow: 0 0 20px 10px rgba(34, 197, 94, 0.6);
        }
      }
      .animate-heal-glow {
        animation: heal-glow 0.6s ease-in-out;
      }

      /* 伤害红色光晕动画 */
      @keyframes damage-glow {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
        25% {
          box-shadow: 0 0 20px 10px rgba(239, 68, 68, 0.6);
        }
        50% {
          box-shadow: 0 0 40px 20px rgba(239, 68, 68, 0.8);
        }
        75% {
          box-shadow: 0 0 20px 10px rgba(239, 68, 68, 0.6);
        }
      }
      .animate-damage-glow {
        animation: damage-glow 0.6s ease-in-out;
      }

      /* 治疗数字飘字动画 */
      @keyframes heal-float {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-30px) scale(1.2);
        }
        100% {
          opacity: 0;
          transform: translateY(-60px) scale(0.8);
        }
      }
      .animate-heal-float {
        animation: heal-float 1s ease-out forwards;
      }

      /* 治疗脉冲动画 */
      @keyframes heal-pulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      .animate-heal-pulse {
        animation: heal-pulse 0.6s ease-in-out;
      }

      /* 技能特效闪光 */
      @keyframes skill-flash {
        0% { opacity: 0; transform: scale(0.5); }
        50% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 0; transform: scale(1.5); }
      }
      .animate-skill-flash {
        animation: skill-flash 0.5s ease-out forwards;
      }

      /* 卡牌拖尾效果 */
      @keyframes card-trail {
        0% {
          transform: translateX(-100vw) scaleX(1);
          opacity: 0.6;
        }
        100% {
          transform: translateX(0) scaleX(0.1);
          opacity: 0;
        }
      }
      .animate-card-trail {
        animation: card-trail 0.4s ease-out forwards;
      }

      /* ===== 首屏加载画面 ===== */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          radial-gradient(ellipse at 50% 38%, rgba(212, 175, 55, 0.09) 0%, transparent 55%),
          radial-gradient(ellipse at 80% 90%, rgba(120, 30, 30, 0.12) 0%, transparent 50%),
          #14100c;
        transition: opacity 0.5s ease;
      }
      #boot-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-seal {
        width: 108px;
        height: 108px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: linear-gradient(160deg, #9e2b25 0%, #7a1f1a 100%);
        border: 2px solid rgba(212, 175, 55, 0.55);
        box-shadow:
          0 0 0 1px rgba(212, 175, 55, 0.2),
          0 12px 40px rgba(0, 0, 0, 0.6),
          inset 0 0 24px rgba(0, 0, 0, 0.35);
        animation: bootSeal 1.8s ease-in-out infinite;
      }
      .boot-seal span {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 64px;
        line-height: 1;
        color: #f3d9a4;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }
      @keyframes bootSeal {
        0%, 100% { transform: rotate(-2deg) scale(1); }
        50% { transform: rotate(2deg) scale(1.04); }
      }
      .boot-title {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 40px;
        letter-spacing: 0.35em;
        padding-left: 0.35em;
        color: #d4af37;
      }
      .boot-sub {
        font-size: 12px;
        letter-spacing: 0.5em;
        padding-left: 0.5em;
        color: rgba(212, 175, 55, 0.45);
      }
      .boot-bar {
        width: 180px;
        height: 2px;
        background: rgba(212, 175, 55, 0.15);
        border-radius: 2px;
        overflow: hidden;
      }
      .boot-bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #d4af37, transparent);
        animation: bootSlide 1.2s ease-in-out infinite;
      }
      @keyframes bootSlide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }

      /* 白天模式基础样式 */
      .theme-light {
        --bg-primary: #faf8f5;
        --bg-secondary: #f5f0eb;
        --text-primary: #2d2a26;
        --text-secondary: #5c5854;
        --accent: #c9a86c;
      }

      .light-bg {
        background: linear-gradient(180deg, #faf8f5 0%, #f5f0eb 100%);
      }

      /* 首屏加载画面跟随主题：避免浅色用户先看到一块深色闪屏 */
      .theme-light #boot-splash {
        background:
          radial-gradient(ellipse at 50% 38%, rgba(201, 168, 108, 0.16) 0%, transparent 55%),
          radial-gradient(ellipse at 80% 90%, rgba(158, 43, 37, 0.06) 0%, transparent 50%),
          #faf8f5;
      }
      .theme-light .boot-title { color: #8b6914; }
      .theme-light .boot-sub { color: rgba(139, 105, 20, 0.55); }
      .theme-light .boot-bar { background: rgba(139, 105, 20, 0.16); }
      .theme-light .boot-bar::after {
        background: linear-gradient(90deg, transparent, #a8842c, transparent);
      }
    </style>
  </head>
  <body>
    <script>
      /* 在 React 挂载前同步已保存的主题，避免浅色用户看到深色闪屏或主题跳变 */
      (function () {
        try {
          if (localStorage.getItem('sgs-theme') === 'light') {
            document.documentElement.classList.add('theme-light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) { /* 忽略 */ }
      })();
    </script>
    <div id="root"></div>

    <!-- 首屏加载画面（React 挂载后移除） -->
    <div id="boot-splash">
      <div class="boot-seal"><span>殺</span></div>
      <div class="boot-title">三國殺</div>
      <div class="boot-sub">群 雄 逐 鹿</div>
      <div class="boot-bar"></div>
    </div>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        // React 首次渲染后淡出加载屏
        var tryHide = function () {
          var root = document.getElementById('root');
          var splash = document.getElementById('boot-splash');
          if (!splash) return;
          if (root && root.childElementCount > 0) {
            splash.classList.add('hide');
            setTimeout(function () { splash.remove(); }, 600);
          } else {
            setTimeout(tryHide, 120);
          }
        };
        setTimeout(tryHide, 150);
      });
    </script>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>

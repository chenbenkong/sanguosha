<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>三国杀：智斗</title>
    
    <!-- 预连接优化 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    
    <!-- 异步加载 Tailwind -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    
    <!-- 字体显示优化 -->
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet"></noscript>
    
    <!-- 预加载关键资源 -->
            <link rel="stylesheet" href="./src/styles/theme.css">
    <style>
      body {
        font-family: 'Noto Serif SC', serif;
        background-color: #1a1512;
        color: #e5e5e5;
        overscroll-behavior: none;
        /* Wood texture background pattern */
        background-image: repeating-linear-gradient(45deg, #1a1512 25%, transparent 25%, transparent 75%, #1a1512 75%, #1a1512), repeating-linear-gradient(45deg, #1a1512 25%, #261f1b 25%, #261f1b 75%, #1a1512 75%, #1a1512);
        background-position: 0 0, 10px 10px;
        background-size: 20px 20px;
      }
      .font-ancient {
        font-family: 'Ma Shan Zheng', cursive;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #2d2420; 
      }
      ::-webkit-scrollbar-thumb {
        background: #8c6a4a; 
        border-radius: 3px;
      }
      .card-shadow {
        box-shadow: 2px 4px 12px rgba(0,0,0,0.7);
      }
      .wood-border {
        border: 2px solid #5d4037;
        box-shadow: inset 0 0 10px #000;
      }
      /* Shimmer Animation */
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .animate-shimmer {
        animation: shimmer 1.5s infinite;
      }

      /* 卡牌飞入动画 - 优化版，使用硬件加速 */
      @keyframes card-fly-in {
        0% {
          transform: translate3d(-100vw, 0, 0) rotate3d(0, 0, 1, -20deg) scale3d(0.6, 0.6, 1);
          opacity: 0;
        }
        60% {
          opacity: 1;
        }
        80% {
          transform: translate3d(10px, 0, 0) rotate3d(0, 0, 1, 3deg) scale3d(1.05, 1.05, 1);
        }
        100% {
          transform: translate3d(0, 0, 0) rotate3d(0, 0, 1, 0deg) scale3d(1, 1, 1);
          opacity: 1;
        }
      }
      .animate-card-fly-in {
        animation: card-fly-in 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        will-change: transform, opacity;
        backface-visibility: hidden;
      }

      /* 卡牌弹跳动画 - 优化版 */
      @keyframes card-bounce {
        0%, 100% { transform: scale3d(1.1, 1.1, 1); }
        50% { transform: scale3d(1.13, 1.13, 1); }
      }
      .animate-card-bounce {
        animation: card-bounce 0.4s ease-in-out 0.5s;
        will-change: transform;
      }

      /* 淡入上移动画 */
      @keyframes fade-in-up {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.4s ease-out 0.8s forwards;
        opacity: 0;
      }

      /* 粒子动画 - 优化版，使用硬件加速 */
      @keyframes particle-1 {
        0% { transform: translate3d(0, 0, 0) scale3d(0, 0, 1); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate3d(-80px, -80px, 0) scale3d(1, 1, 1); opacity: 0; }
      }
      @keyframes particle-2 {
        0% { transform: translate3d(0, 0, 0) scale3d(0, 0, 1); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate3d(80px, -80px, 0) scale3d(1, 1, 1); opacity: 0; }
      }
      @keyframes particle-3 {
        0% { transform: translate3d(0, 0, 0) scale3d(0, 0, 1); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate3d(-80px, 80px, 0) scale3d(1, 1, 1); opacity: 0; }
      }
      @keyframes particle-4 {
        0% { transform: translate3d(0, 0, 0) scale3d(0, 0, 1); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate3d(80px, 80px, 0) scale3d(1, 1, 1); opacity: 0; }
      }
      .animate-particle-1 { 
        animation: particle-1 0.8s ease-out 0.4s forwards; 
        will-change: transform, opacity;
      }
      .animate-particle-2 { 
        animation: particle-2 0.8s ease-out 0.5s forwards; 
        will-change: transform, opacity;
      }
      .animate-particle-3 { 
        animation: particle-3 0.8s ease-out 0.6s forwards; 
        will-change: transform, opacity;
      }
      .animate-particle-4 { 
        animation: particle-4 0.8s ease-out 0.7s forwards; 
        will-change: transform, opacity;
      }

      /* 五谷丰登卡牌入场动画 */
      @keyframes fadeInUp {
        0% {
          opacity: 0;
          transform: translateY(30px) scale(0.9);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* 背景轮播 - 粒子湮灭动画 */
      @keyframes particleDissolve {
        0% {
          opacity: 1;
          transform: scale(1) translate(0, 0);
          filter: blur(0px);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.5) translate(var(--tx, 20px), var(--ty, -20px));
          filter: blur(1px);
        }
        100% {
          opacity: 0;
          transform: scale(0) translate(var(--tx, 40px), var(--ty, -40px));
          filter: blur(4px);
        }
      }

      /* 背景轮播 - 粒子生成动画 */
      @keyframes particleGenerate {
        0% {
          opacity: 0;
          transform: scale(0) translate(var(--tx, -40px), var(--ty, 40px));
          filter: blur(4px);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.5) translate(var(--tx, -20px), var(--ty, 20px));
          filter: blur(1px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translate(0, 0);
          filter: blur(0px);
        }
      }

      /* 背景轮播 - 水墨生成动画 */
      @keyframes inkForm {
        0% {
          opacity: 0;
          clip-path: circle(0% at 30% 30%);
          filter: contrast(1.5) brightness(1.3);
        }
        20% {
          opacity: 0.3;
          clip-path: circle(15% at 30% 30%);
        }
        40% {
          opacity: 0.6;
          clip-path: circle(35% at 35% 40%);
        }
        60% {
          opacity: 0.85;
          clip-path: circle(60% at 45% 50%);
          filter: contrast(1.2) brightness(1.15);
        }
        80% {
          opacity: 0.95;
          clip-path: circle(85% at 50% 55%);
        }
        100% {
          opacity: 1;
          clip-path: circle(150% at 50% 50%);
          filter: contrast(1) brightness(1);
        }
      }
      .animate-ink-form {
        animation: inkForm 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      /* 背景轮播 - 水墨消散动画 */
      @keyframes inkDissolve {
        0% {
          opacity: 1;
          clip-path: circle(150% at 50% 50%);
          filter: contrast(1) brightness(1);
        }
        20% {
          opacity: 0.9;
          clip-path: circle(100% at 55% 45%);
        }
        40% {
          opacity: 0.7;
          clip-path: circle(70% at 60% 40%);
          filter: contrast(1.1) brightness(0.95);
        }
        60% {
          opacity: 0.4;
          clip-path: circle(40% at 65% 35%);
        }
        80% {
          opacity: 0.15;
          clip-path: circle(15% at 70% 30%);
          filter: contrast(1.3) brightness(0.9);
        }
        100% {
          opacity: 0;
          clip-path: circle(0% at 75% 25%);
        }
      }
      .animate-ink-dissolve {
        animation: inkDissolve 3s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
      }

      /* 水墨晕染扩散效果1 */
      @keyframes inkSpread1 {
        0% {
          opacity: 0;
          transform: scale(0.3);
        }
        30% {
          opacity: 0.6;
          transform: scale(0.8);
        }
        60% {
          opacity: 0.4;
          transform: scale(1.2);
        }
        100% {
          opacity: 0;
          transform: scale(1.8);
        }
      }
      .animate-ink-spread-1 {
        animation: inkSpread1 3s ease-out forwards;
      }

      /* 水墨晕染扩散效果2 */
      @keyframes inkSpread2 {
        0% {
          opacity: 0;
          transform: scale(0.2);
        }
        25% {
          opacity: 0.5;
          transform: scale(0.6);
        }
        55% {
          opacity: 0.35;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.6);
        }
      }
      .animate-ink-spread-2 {
        animation: inkSpread2 3s ease-out 0.3s forwards;
      }

      /* 背景轮播 - 粉尘粒子生成动画 */
      @keyframes dustFadeIn {
        0% {
          opacity: 0;
          mask-image: radial-gradient(circle at 20% 20%, black 0%, transparent 5%),
                       radial-gradient(circle at 80% 20%, black 0%, transparent 5%),
                       radial-gradient(circle at 20% 80%, black 0%, transparent 5%),
                       radial-gradient(circle at 80% 80%, black 0%, transparent 5%);
          -webkit-mask-image: radial-gradient(circle at 20% 20%, black 0%, transparent 5%),
                              radial-gradient(circle at 80% 20%, black 0%, transparent 5%),
                              radial-gradient(circle at 20% 80%, black 0%, transparent 5%),
                              radial-gradient(circle at 80% 80%, black 0%, transparent 5%);
        }
        25% {
          opacity: 0.4;
          mask-image: radial-gradient(circle at 20% 20%, black 0%, transparent 25%),
                       radial-gradient(circle at 80% 20%, black 0%, transparent 25%),
                       radial-gradient(circle at 20% 80%, black 0%, transparent 25%),
                       radial-gradient(circle at 80% 80%, black 0%, transparent 25%);
          -webkit-mask-image: radial-gradient(circle at 20% 20%, black 0%, transparent 25%),
                              radial-gradient(circle at 80% 20%, black 0%, transparent 25%),
                              radial-gradient(circle at 20% 80%, black 0%, transparent 25%),
                              radial-gradient(circle at 80% 80%, black 0%, transparent 25%);
        }
        50% {
          opacity: 0.7;
          mask-image: radial-gradient(circle at 20% 20%, black 0%, transparent 50%),
                       radial-gradient(circle at 80% 20%, black 0%, transparent 50%),
                       radial-gradient(circle at 20% 80%, black 0%, transparent 50%),
                       radial-gradient(circle at 80% 80%, black 0%, transparent 50%);
          -webkit-mask-image: radial-gradient(circle at 20% 20%, black 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, black 0%, transparent 50%),
                              radial-gradient(circle at 20% 80%, black 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, black 0%, transparent 50%);
        }
        75% {
          opacity: 0.9;
          mask-image: radial-gradient(circle at 20% 20%, black 0%, transparent 75%),
                       radial-gradient(circle at 80% 20%, black 0%, transparent 75%),
                       radial-gradient(circle at 20% 80%, black 0%, transparent 75%),
                       radial-gradient(circle at 80% 80%, black 0%, transparent 75%);
          -webkit-mask-image: radial-gradient(circle at 20% 20%, black 0%, transparent 75%),
                              radial-gradient(circle at 80% 20%, black 0%, transparent 75%),
                              radial-gradient(circle at 20% 80%, black 0%, transparent 75%),
                              radial-gradient(circle at 80% 80%, black 0%, transparent 75%);
        }
        100% {
          opacity: 1;
          mask-image: none;
          -webkit-mask-image: none;
        }
      }
      .animate-dust-fade-in {
        animation: dustFadeIn 3.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      }

      /* 背景轮播 - 粉尘粒子消散动画 */
      @keyframes dustFadeOut {
        0% {
          opacity: 1;
          mask-image: none;
          -webkit-mask-image: none;
        }
        25% {
          opacity: 0.85;
          mask-image: radial-gradient(circle at 25% 25%, transparent 0%, black 20%),
                       radial-gradient(circle at 75% 25%, transparent 0%, black 20%),
                       radial-gradient(circle at 25% 75%, transparent 0%, black 20%),
                       radial-gradient(circle at 75% 75%, transparent 0%, black 20%);
          -webkit-mask-image: radial-gradient(circle at 25% 25%, transparent 0%, black 20%),
                              radial-gradient(circle at 75% 25%, transparent 0%, black 20%),
                              radial-gradient(circle at 25% 75%, transparent 0%, black 20%),
                              radial-gradient(circle at 75% 75%, transparent 0%, black 20%);
        }
        50% {
          opacity: 0.6;
          mask-image: radial-gradient(circle at 25% 25%, transparent 0%, black 45%),
                       radial-gradient(circle at 75% 25%, transparent 0%, black 45%),
                       radial-gradient(circle at 25% 75%, transparent 0%, black 45%),
                       radial-gradient(circle at 75% 75%, transparent 0%, black 45%);
          -webkit-mask-image: radial-gradient(circle at 25% 25%, transparent 0%, black 45%),
                              radial-gradient(circle at 75% 25%, transparent 0%, black 45%),
                              radial-gradient(circle at 25% 75%, transparent 0%, black 45%),
                              radial-gradient(circle at 75% 75%, transparent 0%, black 45%);
        }
        75% {
          opacity: 0.3;
          mask-image: radial-gradient(circle at 25% 25%, transparent 0%, black 70%),
                       radial-gradient(circle at 75% 25%, transparent 0%, black 70%),
                       radial-gradient(circle at 25% 75%, transparent 0%, black 70%),
                       radial-gradient(circle at 75% 75%, transparent 0%, black 70%);
          -webkit-mask-image: radial-gradient(circle at 25% 25%, transparent 0%, black 70%),
                              radial-gradient(circle at 75% 25%, transparent 0%, black 70%),
                              radial-gradient(circle at 25% 75%, transparent 0%, black 70%),
                              radial-gradient(circle at 75% 75%, transparent 0%, black 70%);
        }
        100% {
          opacity: 0;
          mask-image: radial-gradient(circle at 25% 25%, transparent 0%, black 95%),
                       radial-gradient(circle at 75% 25%, transparent 0%, black 95%),
                       radial-gradient(circle at 25% 75%, transparent 0%, black 95%),
                       radial-gradient(circle at 75% 75%, transparent 0%, black 95%);
          -webkit-mask-image: radial-gradient(circle at 25% 25%, transparent 0%, black 95%),
                              radial-gradient(circle at 75% 25%, transparent 0%, black 95%),
                              radial-gradient(circle at 25% 75%, transparent 0%, black 95%),
                              radial-gradient(circle at 75% 75%, transparent 0%, black 95%);
        }
      }
      .animate-dust-fade-out {
        animation: dustFadeOut 3.5s cubic-bezier(0.4, 0, 0.6, 1) forwards;
      }

      /* 粉尘粒子漂浮动画 */
      @keyframes dustParticle {
        0% {
          opacity: 0;
          transform: scale(0) translate(0, 0);
        }
        20% {
          opacity: 0.6;
          transform: scale(1.5) translate(var(--tx, 10px), var(--ty, -10px));
        }
        60% {
          opacity: 0.3;
          transform: scale(2) translate(var(--tx, 20px), var(--ty, -20px));
        }
        100% {
          opacity: 0;
          transform: scale(0.5) translate(var(--tx, 30px), var(--ty, -30px));
        }
      }
      .animate-dust-particle {
        animation: dustParticle 3s ease-out forwards;
      }

      /* 四角柔和扩散动画 */
      @keyframes cornerSoft {
        0% {
          opacity: 0;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
      }
      .animate-corner-soft {
        animation: cornerSoft 4s ease-in-out infinite alternate;
      }

      /* 水波淡入 */
      @keyframes waterFadeIn {
        0% {
          opacity: 0;
          transform: scale(1.03);
          filter: blur(2px);
        }
        50% {
          opacity: 0.7;
          filter: blur(1px);
        }
        100% {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
        }
      }
      .animate-water-fade-in {
        animation: waterFadeIn 3s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      }

      /* 水波淡出 */
      @keyframes waterFadeOut {
        0% {
          opacity: 1;
          filter: blur(0);
        }
        100% {
          opacity: 0;
          filter: blur(1px);
        }
      }
      .animate-water-fade-out {
        animation: waterFadeOut 3s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      }

      /* 水波纹扩散 */
      @keyframes waterRipple {
        0% {
          opacity: 0.3;
          transform: translate(-50%, -50%) scale(0.5);
        }
        50% {
          opacity: 0.15;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(2);
        }
      }
      .animate-water-ripple {
        animation: waterRipple 3s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      }

      /* 闪烁光点 */
      @keyframes sparkle {
        0%, 100% {
          opacity: 0;
          transform: scale(0.5);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-sparkle {
        animation: sparkle 2s ease-in-out infinite;
      }

      /* 背景轮播 - 进度条动画 */
      @keyframes progressBar {
        0% { width: 0%; }
        100% { width: 100%; }
      }

      /* 伤害震动动画 */
      @keyframes damage-shake {
        0%, 100% { transform: translateX(0); }
        10% { transform: translateX(-10px) rotate(-3deg); }
        20% { transform: translateX(10px) rotate(3deg); }
        30% { transform: translateX(-10px) rotate(-3deg); }
        40% { transform: translateX(10px) rotate(3deg); }
        50% { transform: translateX(-5px) rotate(-2deg); }
        60% { transform: translateX(5px) rotate(2deg); }
        70% { transform: translateX(-3px) rotate(-1deg); }
        80% { transform: translateX(3px) rotate(1deg); }
        90% { transform: translateX(0) rotate(0); }
      }
      .animate-damage-shake {
        animation: damage-shake 0.6s ease-in-out;
      }

      /* 伤害数字飘字动画 */
      @keyframes damage-float {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-30px) scale(1.2);
        }
        100% {
          opacity: 0;
          transform: translateY(-60px) scale(0.8);
        }
      }
      .animate-damage-float {
        animation: damage-float 1s ease-out forwards;
      }

      /* 治疗绿色光晕动画 */
      @keyframes heal-glow {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
        }
        25% {
          box-shadow: 0 0 20px 10px rgba(34, 197, 94, 0.6);
        }
        50% {
          box-shadow: 0 0 40px 20px rgba(34, 197, 94, 0.8);
        }
        75% {
          box-shadow: 0 0 20px 10px rgba(34, 197, 94, 0.6);
        }
      }
      .animate-heal-glow {
        animation: heal-glow 0.6s ease-in-out;
      }

      /* 伤害红色光晕动画 */
      @keyframes damage-glow {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
        25% {
          box-shadow: 0 0 20px 10px rgba(239, 68, 68, 0.6);
        }
        50% {
          box-shadow: 0 0 40px 20px rgba(239, 68, 68, 0.8);
        }
        75% {
          box-shadow: 0 0 20px 10px rgba(239, 68, 68, 0.6);
        }
      }
      .animate-damage-glow {
        animation: damage-glow 0.6s ease-in-out;
      }

      /* 治疗数字飘字动画 */
      @keyframes heal-float {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-30px) scale(1.2);
        }
        100% {
          opacity: 0;
          transform: translateY(-60px) scale(0.8);
        }
      }
      .animate-heal-float {
        animation: heal-float 1s ease-out forwards;
      }

      /* 治疗脉冲动画 */
      @keyframes heal-pulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      .animate-heal-pulse {
        animation: heal-pulse 0.6s ease-in-out;
      }

      /* 技能特效闪光 */
      @keyframes skill-flash {
        0% { opacity: 0; transform: scale(0.5); }
        50% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 0; transform: scale(1.5); }
      }
      .animate-skill-flash {
        animation: skill-flash 0.5s ease-out forwards;
      }

      /* 卡牌拖尾效果 */
      @keyframes card-trail {
        0% {
          transform: translateX(-100vw) scaleX(1);
          opacity: 0.6;
        }
        100% {
          transform: translateX(0) scaleX(0.1);
          opacity: 0;
        }
      }
      .animate-card-trail {
        animation: card-trail 0.4s ease-out forwards;
      }

      /* 白天模式基础样式 */
      .theme-light {
        --bg-primary: #faf8f5;
        --bg-secondary: #f5f0eb;
        --text-primary: #2d2a26;
        --text-secondary: #5c5854;
        --accent: #c9a86c;
      }

      .light-bg {
        background: linear-gradient(180deg, #faf8f5 0%, #f5f0eb 100%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

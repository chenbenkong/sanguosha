name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 闸门 1：类型检查，失败即阻断部署
      - name: Type check
        run: npx tsc --noEmit

      # 闸门 2：单元测试。
      # test:unit 走 vitest（当前无 vitest 用例，--passWithNoTests 保证不会误红）；
      # test 走 node:test，是现有 14 条规则用例的真实入口，两者都跑才不漏测。
      - name: Unit tests (vitest)
        run: npm run test:unit
      - name: Unit tests (node:test)
        run: npm test

      - name: Build
        run: npx vite build --base=./

      # 闸门 3：端到端。需要系统 Chrome —— ubuntu-latest 自带的 chrome 可用。
      # 之所以放在 Build 之后：e2e 需要 dist 产物起 vite preview。
      - name: Locate Chrome
        id: chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "path=$(command -v google-chrome)" >> $GITHUB_OUTPUT
          elif [ -x "/usr/bin/google-chrome-stable" ]; then
            echo "path=/usr/bin/google-chrome-stable" >> $GITHUB_OUTPUT
          else
            echo "未找到 Chrome，跳过 e2e" 
            echo "path=" >> $GITHUB_OUTPUT
          fi

      - name: E2E tests (real browser)
        if: steps.chrome.outputs.path != ''
        env:
          E2E_CHROME: ${{ steps.chrome.outputs.path }}
        run: npm run test:e2e

      # 上传前打印体积摘要，便于在 Actions 日志里追踪体积回归
      - name: Bundle size summary
        run: |
          echo "=== dist total ==="
          du -sh dist
          echo "=== top 10 largest files ==="
          find dist -type f -printf '%s\t%p\n' \
            | sort -rn \
            | head -10 \
            | awk -F '\t' '{ printf "%8.1f kB  %s\n", $1/1024, $2 }'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
